apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image }}
          ports:
            - containerPort: {{ .Values.port }}
              hostPort: {{ .Values.port }}
          envFrom:
            - configMapRef:
                name: {{ .Values.name }}
          livenessProbe:
            httpGet:
              path: /actuator/liveness
              port: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: /actuator/readiness
              port: {{ .Values.port }}
      volumes:
        - name: {{ .Values.name }}
          configMap:
            name: {{ .Values.name }}